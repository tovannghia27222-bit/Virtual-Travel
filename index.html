<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chibi Land Việt Nam - Khám phá Việt Nam 3D</title>
    <meta name="description" content="Game giả lập du lịch Việt Nam 3D phong cách chibi. Khám phá Đà Lạt, Hội An, Hạ Long cùng bạn bè!">
    <meta name="keywords" content="chibi, vietnam, game, 3d, dalat, hoian, halong, virtual tour, multiplayer">
    <meta name="author" content="Chibi Land Team">
    <meta property="og:title" content="Chibi Land Việt Nam">
    <meta property="og:description" content="Khám phá Việt Nam theo phong cách Chibi 3D">
    <meta property="og:type" content="website">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: linear-gradient(135deg, #1a5f2a 0%, #0d3320 50%, #1a3a5c 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #unity-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #unity-loading-bar {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 100;
        }
        .game-logo {
            width: 180px;
            height: 180px;
            margin: 0 auto 24px;
            background: rgba(255,255,255,0.1);
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.2);
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        .game-title {
            color: #fff;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }
        .game-subtitle {
            color: rgba(255,255,255,0.7);
            font-size: 15px;
            margin-bottom: 32px;
        }
        .progress-container {
            width: 320px;
            height: 10px;
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            overflow: hidden;
            margin: 0 auto 16px;
        }
        #unity-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        #unity-progress-text {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            margin-top: 8px;
        }
        .loading-tips {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            margin-top: 20px;
            font-style: italic;
            min-height: 20px;
        }
        #unity-warning {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(234, 179, 8, 0.9);
            color: #000;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            z-index: 101;
        }
        #unity-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            color: rgba(255,255,255,0.5);
            font-size: 12px;
        }
        #unity-fullscreen-button {
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            transition: all 0.2s;
        }
        #unity-fullscreen-button:hover {
            background: rgba(255,255,255,0.2);
        }
        .mobile-warning {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0d3320;
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }
        .mobile-warning h2 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 16px;
        }
        .mobile-warning p {
            color: rgba(255,255,255,0.7);
            font-size: 15px;
            line-height: 1.6;
        }
        @media (max-width: 768px) {
            .game-title { font-size: 22px; }
            .progress-container { width: 260px; }
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>

        <div id="unity-loading-bar">
            <div class="game-logo">🏔️</div>
            <div class="game-title">Chibi Land Việt Nam</div>
            <div class="game-subtitle">Đang chuẩn bị chuyến du ngoạn...</div>
            <div class="progress-container">
                <div id="unity-progress-bar"></div>
            </div>
            <div id="unity-progress-text">0%</div>
            <div class="loading-tips" id="loading-tip">Đang tải thế giới 3D...</div>
        </div>

        <div id="unity-warning"></div>

        <div id="unity-footer">
            <span>Chibi Land Việt Nam v1.0.0 | Unity WebGL</span>
            <button id="unity-fullscreen-button" onclick="toggleFullscreen()">⛶ Toàn màn hình</button>
        </div>
    </div>

    <script>
        // ====== CẤU HÌNH ======
        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/chibi-vietnam.loader.js";
        const config = {
            dataUrl: buildUrl + "/chibi-vietnam.data.gz",
            frameworkUrl: buildUrl + "/chibi-vietnam.framework.js.gz",
            codeUrl: buildUrl + "/chibi-vietnam.wasm.gz",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "ChibiLandTeam",
            productName: "Chibi Land Việt Nam",
            productVersion: "1.0.0",
            showBanner: unityShowBanner,
        };

        // ====== TIPS ======
        const tips = [
            "Nhấn WASD để di chuyển, chuột để xoay camera...",
            "Nhấn 1-4 để thực hiện hành động: vẫy tay, ngồi, chụp ảnh, cổ vũ!",
            "Chợ đêm Đà Lạt chỉ mở khi trời tối trong game...",
            "Chat với bạn bè bằng phím T hoặc Enter...",
            "Khám phá 9 địa điểm nổi tiếng khắp Việt Nam!",
            "Tùy chỉnh trang phục: áo dài, nón lá, beret...",
            "Thời tiết thay đổi theo thời gian thực!",
            "Chụp ảnh đẹp và lưu lại kỷ niệm nhé!",
        ];
        let tipIndex = 0;
        setInterval(() => {
            tipIndex = (tipIndex + 1) % tips.length;
            const tipEl = document.getElementById("loading-tip");
            if (tipEl) tipEl.textContent = tips[tipIndex];
        }, 3000);

        // ====== BANNER WARNING ======
        function unityShowBanner(msg, type) {
            const warningBanner = document.getElementById("unity-warning");
            warningBanner.style.display = "block";
            warningBanner.innerHTML = msg;
            if (type === "error") warningBanner.style.background = "rgba(239, 68, 68, 0.9)";
            if (type === "warning") warningBanner.style.background = "rgba(234, 179, 8, 0.9)";
        }

        // ====== DETECT MOBILE ======
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile) {
            config.devicePixelRatio = Math.min(config.devicePixelRatio || 1, 2);
        }

        // ====== CANVAS SIZE ======
        const canvas = document.querySelector("#unity-canvas");
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.width = "100%";
            canvas.style.height = "100%";
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        // ====== FULLSCREEN ======
        function toggleFullscreen() {
            const container = document.getElementById("unity-container");
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    console.warn("Fullscreen error:", err);
                });
            } else {
                document.exitFullscreen();
            }
        }
        document.addEventListener("fullscreenchange", () => {
            const btn = document.getElementById("unity-fullscreen-button");
            if (btn) btn.textContent = document.fullscreenElement ? "⛶ Thoát" : "⛶ Toàn màn hình";
        });

        // ====== LOAD UNITY ======
        const loadingBar = document.getElementById("unity-loading-bar");
        const progressBar = document.getElementById("unity-progress-bar");
        const progressText = document.getElementById("unity-progress-text");

        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                const percent = Math.round(progress * 100);
                progressBar.style.width = percent + "%";
                progressText.textContent = percent + "%";
            }).then((unityInstance) => {
                loadingBar.style.display = "none";
                console.log("[Chibi Land] Unity loaded successfully!");
            }).catch((message) => {
                unityShowBanner("Lỗi tải game: " + message, "error");
                console.error(message);
            });
        };
        document.body.appendChild(script);

        // ====== PREVENT CONTEXT MENU ======
        document.addEventListener("contextmenu", e => e.preventDefault());
    </script>
</body>
</html>
